# dsh-delegate-router bundle patch.
#
# Host rows:
#   - the delegation router: classification rules, budget limits, and the
#     Flash/Pro routes for light/heavy subagent tasks;
#   - the stats sidecar mounted as its own top-level row (the API gateway
#     resolves Remote receivers on the host plane, so the service must be a
#     host-plane row like the core message-feedback service, not a nested
#     ctx.plugin child).
# The package's dsh.client declaration adds the browser half (ledger panel).
#
# A patch replaces the targeted row's whole `config`, so restate every key.

- insert:
    - id: subagent-router
      name: 'dsh-delegate-router'
      config:
        mode: auto            # auto | off | flash-all
        flashProvider: ''     # provider id owning flashModel (or env DSH_DELEGATE_ROUTER_FLASH_PROVIDER)
        flashModel: ''        # cheap model for light tasks (or env DSH_DELEGATE_ROUTER_FLASH_MODEL)
        proProvider: ''       # provider id owning proModel (or env DSH_DELEGATE_ROUTER_PRO_PROVIDER)
        proModel: ''          # strong model for heavy tasks (or env DSH_DELEGATE_ROUTER_PRO_MODEL)
        budgetCapTokens: 0    # 0 = no budget-based downgrade
        lightKeywords:
          - search
          - 搜索
          - 查找
          - 总结
          - summarize
          - list
          - 列出
        heavyKeywords:
          - refactor
          - 重构
          - implement
          - 实现
          - debug
          - 调试

    - id: delegate-router-stats
      name: 'dsh-delegate-router/stats'

